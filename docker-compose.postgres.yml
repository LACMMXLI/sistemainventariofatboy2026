services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fatboy_inventory
      POSTGRES_USER: fatboy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatboy -d fatboy_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
