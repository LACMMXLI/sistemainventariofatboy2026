services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fatboy_inventory
      POSTGRES_USER: fatboy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatboy -d fatboy_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_S3}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_S3}
    volumes:
      - object_storage_data:/data
    expose:
      - "9000"
      - "9001"

  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - object-storage
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${SERVICE_USER_S3}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_S3}
      S3_BUCKET: product-images
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://object-storage:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\"; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      "

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://fatboy:${POSTGRES_PASSWORD}@db:5432/fatboy_inventory
      JWT_SECRET: ${JWT_SECRET}
      SYSTEM_OWNER_EMAIL: ${SYSTEM_OWNER_EMAIL}
      SYSTEM_OWNER_PASSWORD: ${SYSTEM_OWNER_PASSWORD}
      S3_ENDPOINT: http://object-storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: product-images
      S3_ACCESS_KEY: ${SERVICE_USER_S3}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_64_S3}
      S3_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  object_storage_data:
